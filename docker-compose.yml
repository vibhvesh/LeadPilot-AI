services:
  app:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:1102:1102"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leadpilot
      POSTGRES_USER: leadpilot
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - leadpilot_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadpilot -d leadpilot"]
      interval: 5s
      retries: 20
    restart: unless-stopped
volumes:
  leadpilot_db:
