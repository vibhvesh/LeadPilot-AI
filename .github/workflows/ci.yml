name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Check shell scripts
        run: |
          bash -n scripts/install-docker-ubuntu.sh
          bash -n scripts/backup.sh
          bash -n scripts/restore.sh
          bash -n scripts/install.sh
          bash -n deploy/proxy/entrypoint.sh
      - name: Run tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the HTTP stack
        run: |
          set -euo pipefail
          umask 077
          db_password="$(openssl rand -hex 24)"
          session_secret="$(openssl rand -hex 32)"
          encryption_key="$(openssl rand -hex 32)"
          cat > .env <<EOF
          DB_PASSWORD=${db_password}
          SESSION_SECRET=${session_secret}
          ENCRYPTION_KEY=${encryption_key}
          APP_ENV=production
          DEMO_MODE=false
          SESSION_COOKIE_NAME=leadpilot_session
          SESSION_MAX_AGE_SECONDS=28800
          SESSION_COOKIE_SECURE=false
          PUBLIC_BASE_URL=http://127.0.0.1:8080
          SUPER_ADMIN_EMAIL=vibhvesh@gmail.com
          SEARCH_PROVIDER=auto
          TLS_MODE=http
          LEADPILOT_DOMAIN=
          ACME_EMAIL=
          LEADPILOT_BIND=127.0.0.1
          LEADPILOT_HTTP_PORT=8080
          LEADPILOT_HTTPS_PORT=8443
          LEADPILOT_APP_PORT=1102
          POSTGRES_USER=leadpilot
          POSTGRES_DB=leadpilot
          EOF
          unset db_password session_secret encryption_key
          docker compose build
          user="$(docker inspect --format '{{.Config.User}}' leadpilot:local)"
          test "$user" = "appuser"
          docker inspect --format '{{.Config.Healthcheck.Test}}' leadpilot:local | grep -q /health
          docker compose up -d --wait
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS http://127.0.0.1:8080/login | grep -q "Sign in to LeadPilot"
          curl -fsS http://127.0.0.1:1102/health
          docker compose down
